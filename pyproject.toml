[project]
name = "sovereign-rag"
version = "0.1.0"
description = "Sovereign, compliance-by-design RAG accelerator (Mistral, Qdrant, AI Act / GDPR)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sovereign RAG" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
mistral = ["mistralai>=1.0"]
qdrant = ["qdrant-client>=1.9"]
embeddings = ["fastembed>=0.3"]
rerank = ["sentence-transformers>=3.0"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
observability = ["langfuse>=2.40", "opentelemetry-sdk>=1.25"]
auth-oidc = ["pyjwt[crypto]>=2.8"]
pii-vault = ["cryptography>=42"]
finetune-local = [
    "transformers>=4.41",
    "peft>=0.11",
    "trl>=0.9",
    "datasets>=2.19",
    "torch>=2.2",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pre-commit>=3.7",
    "pyjwt[crypto]>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
mypy_path = "src"
packages = ["sovereign_rag"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "mistralai.*", "presidio_analyzer.*", "presidio_anonymizer.*", "fastembed.*", "langfuse.*", "sentence_transformers.*", "transformers.*", "peft.*", "trl.*", "datasets.*", "torch.*", "jwt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --cov=sovereign_rag --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
