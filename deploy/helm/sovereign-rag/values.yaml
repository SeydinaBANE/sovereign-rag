# Default values for the sovereign-rag chart.
# Sovereign defaults: runs offline (fake providers) until you wire Mistral/Qdrant.

replicaCount: 2

image:
  repository: ghcr.io/seydinabane/sovereign-rag
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

# Matches the non-root appuser (uid auto-assigned) baked into the Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

# Pin workloads to an EU region/zone for data residency.
nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sovereign-rag.example.eu
      paths:
        - path: /
          pathType: Prefix
  tls: []

probes:
  livenessPath: /healthz
  readinessPath: /readyz
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Non-secret SRAG_* settings rendered into a ConfigMap (env_prefix=SRAG_).
config:
  SRAG_LLM_PROVIDER: fake
  SRAG_EMBEDDING_PROVIDER: fake
  SRAG_VECTOR_PROVIDER: memory
  SRAG_RETRIEVAL_MODE: hybrid
  SRAG_AUTH_ENABLED: "false"
  SRAG_AUTH_PROVIDER: static
  SRAG_ALLOWED_REGIONS: eu-west,eu-central
  SRAG_DEFAULT_REGION: eu-west
  SRAG_PII_POLICY: mask
  SRAG_FINE_TUNING_PROVIDER: none
  SRAG_LANGFUSE_ENABLED: "false"

# Secret SRAG_* values. Either provide them here (templated into a Secret) or
# point existingSecret at a pre-created Secret (keys must be SRAG_* env names).
secrets:
  existingSecret: ""
  data: {}
    # SRAG_MISTRAL_API_KEY: ""
    # SRAG_OIDC_HS256_SECRET: ""
    # SRAG_LANGFUSE_SECRET_KEY: ""

extraEnv: []

# Optional self-hosted Qdrant (disabled by default: prefer a managed EU instance).
qdrant:
  enabled: false
  image: qdrant/qdrant:v1.9.7
  replicas: 1
  port: 6333
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1
