{{- if and (not .Values.secrets.existingSecret) .Values.secrets.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sovereign-rag.fullname" . }}
  labels:
    {{- include "sovereign-rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
