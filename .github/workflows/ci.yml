name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Format check (ruff)
        run: uv run ruff format --check src tests

      - name: Type check (mypy strict)
        run: uv run mypy

      - name: Tests (pytest + coverage)
        run: uv run pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: SAST (bandit)
        run: uv run bandit -r src -c pyproject.toml

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit
        continue-on-error: true

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
    env:
      SRAG_AUDIT_DSN: postgresql://postgres:postgres@localhost:5432/srag
      SRAG_PII_VAULT_DSN: postgresql://postgres:postgres@localhost:5432/srag
      SRAG_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra qdrant --extra audit-postgres --extra pii-vault --frozen

      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "$SRAG_QDRANT_URL/readyz"; then exit 0; fi
            sleep 2
          done
          echo "Qdrant did not become ready" && exit 1

      - name: Integration tests (live Postgres + Qdrant)
        run: uv run pytest -m integration --no-cov

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint chart
        run: helm lint deploy/helm/sovereign-rag

      - name: Render chart (default + EU overlays)
        run: |
          helm template srag deploy/helm/sovereign-rag > /dev/null
          helm template srag deploy/helm/sovereign-rag -f deploy/helm/sovereign-rag/values-ovhcloud.yaml > /dev/null
          helm template srag deploy/helm/sovereign-rag -f deploy/helm/sovereign-rag/values-outscale.yaml > /dev/null
          helm template srag deploy/helm/sovereign-rag --set qdrant.enabled=true --set secrets.data.SRAG_MISTRAL_API_KEY=x > /dev/null
